services:
  # React-сайт
  frontend-app:
    build: ./frontend
    restart: always

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

    environment:
      - VIRTUAL_HOST=${DOMAIN},www.${DOMAIN}
      - LETSENCRYPT_HOST=${DOMAIN},www.${DOMAIN}
      - LETSENCRYPT_EMAIL=${EMAIL}

    networks:
      - web-network

  # Главный прокси
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: nginx-proxy

    restart: always

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - /fakesite/nginx/certs:/etc/nginx/certs:ro
      - /fakesite/nginx/vhost:/etc/nginx/vhost.d
      - /fakesite/nginx/html:/usr/share/nginx/html

    networks:
      - web-network

    extra_hosts:
      - "host.docker.internal:host-gateway"

  # SSL-сервис для сертификатов
  ssl-companion:
    image: nginxproxy/acme-companion
    container_name: nginx-proxy-acme

    restart: always

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

    volumes_from:
      - nginx-proxy

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /fakesite/nginx/certs:/etc/nginx/certs:rw
      - acme:/etc/acme.sh

    networks:
      - web-network

  vk-turn-proxy:
    build:
      context: .
      dockerfile: Dockerfile.vk-turn-proxy

    container_name: vk-turn-proxy
    restart: unless-stopped
    network_mode: "host"

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

    command:
      [
        "/app/server",
        "-listen", "0.0.0.0:56000",
        "-connect", "127.0.0.1:65432"
      ]

networks:
  web-network:
    driver: bridge

volumes:
  acme: