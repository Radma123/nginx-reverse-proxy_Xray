services:
  # React-сайт
  frontend-app:
    build: ./frontend
    restart: always
    environment:
      - VIRTUAL_HOST=${DOMAIN}
      - LETSENCRYPT_HOST=${DOMAIN}
      - LETSENCRYPT_EMAIL=${EMAIL}
    networks:
      - web-network

  # Главный прокси
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      # - certs:/etc/nginx/certs
      # - vhost:/etc/nginx/vhost.d
      # - html:/usr/share/nginx/html
      - /fakesite/nginx/certs:/etc/nginx/certs:ro
      - /fakesite/nginx/vhost:/etc/nginx/vhost.d
      - /fakesite/nginx/html:/usr/share/nginx/html
    restart: always
    networks:
      - web-network
    extra_hosts:
      - "host.docker.internal:host-gateway" # доступ к сети хоста

  # SSL-сервис для сертификатов
  ssl-companion:
    image: nginxproxy/acme-companion
    container_name: nginx-proxy-acme
    volumes_from:
      - nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /fakesite/nginx/certs:/etc/nginx/certs:rw  # Компаньон записывает
      - acme:/etc/acme.sh
    restart: always
    networks:
      - web-network

  hysteria:
    image: tobyxdd/hysteria
    container_name: hysteria
    restart: always
    network_mode: "host"
    volumes:
      - acme:/acme
      - ./hysteria.yaml:/etc/hysteria.yaml
      - /fakesite/nginx/certs:/etc/nginx/certs:ro
    command: ["server", "-c", "/etc/hysteria.yaml"]

  vk-turn-proxy:
    image: alpine:latest
    container_name: vk-turn-proxy
    restart: always
    ports:
      - "56000:56000"
    networks:
      - web-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache wget
        wget https://github.com/cacggghp/vk-turn-proxy/releases/download/v1.2.3/server-linux-amd64 -O /usr/local/bin/server
        chmod +x /usr/local/bin/server
        /usr/local/bin/server -listen 0.0.0.0:56000 -connect host.docker.internal:65432

networks:
  web-network:
    driver: bridge

volumes:
  acme:
